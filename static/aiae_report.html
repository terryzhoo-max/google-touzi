<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIAE 科学回测审计报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0b0d13;
            --panel-bg: #151821;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-size: 1.8rem;
        }
        .header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .metric-card.oos {
            border-left: 3px solid var(--accent);
        }
        .metric-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-val {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: monospace;
        }
        .chart-container {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            height: 400px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AIAE 跨市场宏观宽基高胜率回测</h1>
            <p>标的池: S&P 500 (SPX), 日经225 (N225), 沪深300 (000300.SH) | 成本模型: 0.1% 滑点 + T+1 开盘模拟 | 分区: 70% In-Sample, 30% Out-of-Sample</p>
        </div>

        <div id="loading" class="loading">正在拉取机构级科学回测数据，计算可能耗时10-30秒，请稍候...</div>
        
        <div id="content" style="display:none;">
            <h3 style="color:var(--text-secondary); margin-bottom:12px; font-size:1rem; border-left:3px solid var(--accent); padding-left:8px;">Out-Of-Sample (样本外盲测) 核心指标</h3>
            <div class="metrics-grid" id="oos-metrics"></div>

            <h3 style="color:var(--text-secondary); margin-bottom:12px; font-size:1rem; border-left:3px solid var(--border); padding-left:8px;">In-Sample (样本内) 核心指标</h3>
            <div class="metrics-grid" id="is-metrics"></div>

            <div class="chart-container" id="chart-equity"></div>
            <div class="chart-container" id="chart-drawdown" style="height:250px;"></div>
        </div>
    </div>

    <script>
        function formatVal(k, v) {
            if (['Annual_Return', 'Annual_Volatility', 'Max_Drawdown', 'CVaR_5', 'Win_Rate', 'Signal_Hit_Rate', 'Ulcer_Index'].includes(k)) return v.toFixed(2) + '%';
            return v.toFixed(2);
        }

        function getColor(k, v) {
            if (k === 'Sharpe_Ratio') return v > 1.0 ? 'var(--success)' : (v > 0.5 ? 'var(--warning)' : 'var(--danger)');
            if (k === 'Win_Rate' || k === 'Signal_Hit_Rate') return v > 50.0 ? 'var(--success)' : 'var(--danger)';
            if (k === 'Return_Skewness') return v > 0 ? 'var(--success)' : 'var(--danger)';
            if (k === 'Max_Drawdown') return v < -20.0 ? 'var(--danger)' : 'var(--text-primary)';
            return 'var(--text-primary)';
        }

        fetch('/api/institutional/aiae_backtest')
            .then(r => r.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                
                if (res.error) {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerHTML = `<span style="color:var(--danger)">错误: ${res.error}</span>`;
                    return;
                }

                document.getElementById('content').style.display = 'block';

                const m = res.metrics;
                
                // Render OOS
                let htmlOOS = '';
                Object.keys(m.Out_Of_Sample).forEach(k => {
                    htmlOOS += `
                        <div class="metric-card oos">
                            <div class="metric-label">${k.replace(/_/g, ' ')}</div>
                            <div class="metric-val" style="color:${getColor(k, m.Out_Of_Sample[k])}">${formatVal(k, m.Out_Of_Sample[k])}</div>
                        </div>
                    `;
                });
                document.getElementById('oos-metrics').innerHTML = htmlOOS;

                // Render IS
                let htmlIS = '';
                Object.keys(m.In_Sample).forEach(k => {
                    htmlIS += `
                        <div class="metric-card">
                            <div class="metric-label">${k.replace(/_/g, ' ')}</div>
                            <div class="metric-val" style="color:${getColor(k, m.In_Sample[k])}">${formatVal(k, m.In_Sample[k])}</div>
                        </div>
                    `;
                });
                document.getElementById('is-metrics').innerHTML = htmlIS;

                // Chart: Equity
                const eqChart = echarts.init(document.getElementById('chart-equity'));
                const splitIndex = Math.floor(res.data.dates.length * 0.70);
                const splitDate = res.data.dates[splitIndex];

                eqChart.setOption({
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['AIAE 策略净值', '全球宽基等权基准'], textStyle: { color: '#e2e8f0' } },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', boundaryGap: false, data: res.data.dates, axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8' } },
                    yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#1f2937' } }, axisLabel: { color: '#94a3b8' } },
                    series: [
                        { name: 'AIAE 策略净值', type: 'line', data: res.data.strat_cum_return, symbol: 'none', itemStyle: { color: '#3b82f6' }, markLine: { data: [{ xAxis: splitDate, name: 'IS / OOS 分界线', label: { formatter: 'OOS ->', position: 'end', color: '#f59e0b' }, lineStyle: { color: '#f59e0b', type: 'dashed' } }] } },
                        { name: '全球宽基等权基准', type: 'line', data: res.data.bench_cum_return, symbol: 'none', itemStyle: { color: '#64748b' } }
                    ]
                });

                // Chart: Drawdown
                const ddChart = echarts.init(document.getElementById('chart-drawdown'));
                ddChart.setOption({
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'axis', formatter: p => `${p[0].name}<br/>回撤: ${(p[0].value * 100).toFixed(2)}%` },
                    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                    xAxis: { type: 'category', boundaryGap: false, data: res.data.dates, axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { show: false } },
                    yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#1f2937' } }, axisLabel: { color: '#94a3b8', formatter: v => (v * 100).toFixed(0) + '%' } },
                    series: [
                        { name: '策略回撤', type: 'line', data: res.data.drawdown, symbol: 'none', areaStyle: { color: 'rgba(239, 68, 68, 0.2)' }, itemStyle: { color: '#ef4444' } }
                    ]
                });

                window.addEventListener('resize', () => { eqChart.resize(); ddChart.resize(); });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = `<span style="color:var(--danger)">拉取失败: ${err.message}</span>`;
            });
    </script>
</body>
</html>
